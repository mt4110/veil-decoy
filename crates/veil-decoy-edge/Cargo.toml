[package]
name = "veil-decoy-edge"
version = "0.1.0"
edition = "2021"
description = "Veil edge server — catches honeytoken access attempts and fires Slack alerts"
license = "MIT"

[lib]
name = "veil_decoy_edge"
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"        # optimise for size (Cloudflare Workers 1 MB limit)
