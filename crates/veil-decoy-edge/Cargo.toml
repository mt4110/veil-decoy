[package]
name = "veil-decoy-edge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Detect requests to registered HTTP honeytokens and notify Slack"
license = "MIT"

[lib]
name = "veil_decoy_edge"
crate-type = ["cdylib", "rlib"]

[dependencies]
futures-util = { version = "0.3", default-features = false }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
uuid = "1"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
wasm-streams = "0.7"
web-sys = { version = "0.3", features = ["AbortSignal", "Crypto", "Headers", "ReadableStream", "Request", "RequestInit", "RequestRedirect", "Response", "ResponseInit", "Url", "UrlSearchParams", "WorkerGlobalScope"] }
worker-sys = { version = "0.9", features = ["d1"] }
